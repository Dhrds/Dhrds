<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" role="img" aria-labelledby="t d">
  <title id="t">Douglas Silva, desenvolvedor full stack</title>
  <desc id="d">Sistemas sob medida, ferramentas internas e automação com IA, do entendimento do problema ao deploy em produção. Mais de dois anos em produção. Stack principal: Python, TypeScript, C# e Node.js. Foco em web, IA e infraestrutura.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .label { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; letter-spacing: 2px; fill: #59636e; }
    .in { animation: in 0.6s ease-out both; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .rule { transform-box: fill-box; transform-origin: left center; animation: rule 0.7s cubic-bezier(.2,.8,.2,1) 0.2s both; }
    @keyframes rule { from { transform: scaleX(0); } }
    .draw { animation: draw 1.8s ease-in-out 0.3s both; }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out 2s infinite; }
    @keyframes pulse { from { transform: scale(0.7); opacity: 0.9; } to { transform: scale(2.6); opacity: 0; } }
  </style>

  <rect x="2" y="18" width="8" height="8" fill="#0a7d72"/>
  <text x="20" y="27" class="mono" font-size="12" style="letter-spacing:2.5px" fill="#0a7d72">DESENVOLVEDOR FULL STACK</text>
  <text x="0" y="86" font-size="50" font-weight="700" fill="#1f2328" style="letter-spacing:-1px">Douglas Silva</text>
  <rect x="2" y="104" width="72" height="3" fill="#0a7d72" class="rule"/>
  <text x="2" y="142" font-size="17" fill="#59636e">Sistemas sob medida, ferramentas internas e automação com IA,</text>
  <text x="2" y="166" font-size="17" fill="#59636e">do entendimento do problema ao deploy em produção.</text>

