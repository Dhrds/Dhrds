    <path d="M711,56 l5,4 l-5,4" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="in" style="animation-delay:0.66s">
    <rect x="720.5" y="12.5" width="159" height="95" rx="8" fill="#151b23" stroke="#3fd0bf" stroke-width="1.5"/>
