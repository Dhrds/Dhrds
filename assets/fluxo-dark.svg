    <rect x="360.5" y="12.5" width="159" height="95" rx="8" fill="#151b23" stroke="#3d444d"/>
    <text x="374" y="40" class="mono" font-size="11" fill="#3fd0bf" style="letter-spacing:1px">03</text>
    <text x="374" y="68" font-size="16" font-weight="600" fill="#f0f6fc">Back-end</text>
    <text x="374" y="89" font-size="12" fill="#9198a1">Python, C# ou Node.js</text>
    <line x1="524" y1="60" x2="535" y2="60" stroke="#9198a1" stroke-width="1.5"/>
    <path d="M531,56 l5,4 l-5,4" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
