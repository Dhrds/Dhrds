    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .pop { animation: pop 0.45s ease-out both; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
    .bob { animation: bob 1.4s steps(2, jump-none) infinite alternate; }
    @keyframes bob { to { transform: translateY(-3px); } }
    .eyes { animation: blink 4.5s steps(1) infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 93% { opacity: 0; } 96% { opacity: 1; } }
    .glow { animation: glow 1.8s ease-in-out infinite alternate; }
    @keyframes glow { to { opacity: 0.35; } }
    .twinkle { animation: twinkle 2.8s steps(1) infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0; } 40% { opacity: 1; } 70% { opacity: 0; } }
    .type { transform-box: fill-box; transform-origin: left center; animation: type 2.4s steps(48) 1.5s both; }
    @keyframes type { from { transform: scaleX(0); } }
    .cursor { animation: cursor 1s steps(1) infinite; }
    @keyframes cursor { 50% { opacity: 0; } }
  </style>
