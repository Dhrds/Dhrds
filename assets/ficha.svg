  <title id="t">Ficha de personagem de Douglas Silva</title>
  <desc id="d">Desenvolvedor Full Stack, multiclasse, com mais de dois anos em produção. Especialidades: sistemas sob medida para clientes, ferramentas internas, IA e automação, infra e deploy. Stack: Python, TypeScript, C#, Node.js, React, Django, .NET e Docker.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
